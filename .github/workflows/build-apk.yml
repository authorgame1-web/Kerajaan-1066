name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & build web bundle
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Setup Capacitor Android
        run: |
          npm install --legacy-peer-deps --no-save @capacitor/core@6.1.2 @capacitor/cli@6.1.2 @capacitor/android@6.1.2
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Kerajaan 1066 APK
        uses: actions/upload-artifact@v4
        with:
          name: kerajaan-1066-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
